name: Check media sanitiser

# Until this existed, editing the sanitiser or process-media.yml ran nothing at
# all: the worker's vitest suite is scoped to worker/**, and check-config only
# reads the workflow files for undeclared secrets. The first time anyone found
# out a change was wrong was on a real dispatch, after a draft had already moved
# to `processing` and promised the author a published record.
#
# Deliberately a separate workflow rather than a job inside check-config.yml.
# That gate is credential-free and finishes in seconds, and it exists to catch a
# typo before it merges; bolting apt and a Rust build onto it would blunt the
# one check that is currently instant.
#
# No secrets and no variables: every fixture is generated at test time, so this
# needs nothing but the tools.

# The two path lists are duplicated rather than shared through a YAML anchor:
# the Actions workflow parser does not resolve anchors, so one would be a file
# that looks right and never runs.
on:
  pull_request:
    paths:
      - "sanitizer/**"
      - "config/media-decoy.json"
      - ".github/workflows/process-media.yml"
      - ".github/workflows/check-media.yml"
      - ".github/workflows/build-sanitizer.yml"
  push:
    branches: [main]
    paths:
      - "sanitizer/**"
      - "config/media-decoy.json"
      - ".github/workflows/process-media.yml"
      - ".github/workflows/check-media.yml"
      - ".github/workflows/build-sanitizer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A developer's machine may lack exiftool or an ffmpeg with libx264, and
      # the suite reports what it cannot run there. Here a skip would be a hole
      # that looks exactly like a pass, so the guards fail instead.
      MEDIA_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      # Pinned by commit rather than by tag, like build-sanitizer.yml: a tag is
      # a name its owner can move. `toolchain` is stated because a commit ref
      # no longer says "stable" on its own.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sanitizer

      - name: Install ffmpeg and exiftool
        run: |
          sudo apt-get update -qq
          # exiftool is a test dependency only. The sanitiser writes its own
          # EXIF; this is the independent implementation those writes are
          # checked against, so that a bug in our writer cannot pass its own
          # test by agreeing with our reader.
          #
          # nasm is for rav1e's assembly paths, without which AVIF encoding
          # falls back to C and the suite takes several times as long.
          sudo apt-get install -y -qq ffmpeg libimage-exiftool-perl nasm
          # The transcode is H.264 and nothing else. libopenh264 accepts neither
          # -crf nor -preset, so a build without libx264 would not fail over --
          # it would quietly produce something the sanitiser never asked for.
          ffmpeg -hide_banner -encoders | grep -q ' libx264 '

      - name: Check formatting
        working-directory: sanitizer
        run: cargo fmt --check

      - name: Lint
        working-directory: sanitizer
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run the suite
        working-directory: sanitizer
        run: cargo test --locked
