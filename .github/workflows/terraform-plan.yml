name: Terraform plan

# Repository variables used here:
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_ZONE_ID, PROJECT_SLUG, ROOT_DOMAIN,
#   TF_STATE_BUCKET, WORKER_NAME, and optionally SITE_SUBDOMAIN, PAGES_OWNER,
#   WORKER_ENABLED
#
# Secrets used here, all of them read-only:
#   CLOUDFLARE_API_TOKEN_PLAN, R2_STATE_RO_ACCESS_KEY_ID,
#   R2_STATE_RO_SECRET_ACCESS_KEY
#
# Read-only on purpose. This job is triggered by a branch rather than by a
# merge, so it must not hold a credential that could rewrite state or change
# infrastructure. `terraform plan` never persists state, so read is enough.
# The README says how to create the three; until they exist the job stops at
# the check below rather than at an opaque S3 error inside `terraform init`.
#
# Every name here is declared in .github/config-inventory.json and checked by
# `npm run config:check`.

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs for every pull request, including forks, because it needs no
  # credentials at all.
  static-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, main]
    defaults:
      run:
        working-directory: infrastructure/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Only for branches in this repository. A pull request from a fork never
  # reaches this job, so its credentials are never exposed to untrusted code.
  plan:
    needs: static-checks
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/main
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_RO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_RO_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REGION: auto
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_project_slug: ${{ vars.PROJECT_SLUG }}
      TF_VAR_root_domain: ${{ vars.ROOT_DOMAIN }}
      # Empty is the Terraform default for both: the site is served from the
      # apex, so there is no CNAME and no owner to point it at.
      TF_VAR_site_subdomain: ${{ vars.SITE_SUBDOMAIN || '' }}
      TF_VAR_github_pages_owner: ${{ vars.PAGES_OWNER || '' }}
      TF_VAR_worker_enabled: ${{ vars.WORKER_ENABLED || 'false' }}
      TF_VAR_worker_name: ${{ vars.WORKER_NAME }}
    steps:
      - uses: actions/checkout@v7
      # Before Terraform is even installed. An unresolvable secret is an empty
      # string rather than an error, so without this the job would get as far as
      # `terraform init` and fail there complaining about S3 credentials --
      # true, but several steps away from the actual cause.
      #
      # Names only. The point is to say which secret is missing, and a value
      # that is present is exactly the thing that must not be printed.
      - name: Check the read-only credentials exist
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN_PLAN)
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing+=(R2_STATE_RO_ACCESS_KEY_ID)
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing+=(R2_STATE_RO_SECRET_ACCESS_KEY)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. These are the read-only credentials the plan job runs with; the README explains how to create them."
            exit 1
          fi
          echo "All three read-only credentials are present."
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: Initialize with the R2 state backend
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PROJECT_SLUG: ${{ vars.PROJECT_SLUG }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${PROJECT_SLUG}/production/terraform.tfstate" \
            -backend-config="region=auto" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
      - name: Plan
        run: terraform plan -input=false -no-color
