name: Deploy Worker

# Builds the Wrangler configuration from repository variables and deploys the
# Telegram authoring Worker. Nothing deployment-specific is written here: every
# name and URL arrives as a variable, every credential as a secret.
#
# Repository variables:
#   CLOUDFLARE_ACCOUNT_ID, PROJECT_SLUG, WORKER_NAME, CONTENT_BASE_URL,
#   MEDIA_BASE_URL, SITE_BASE_URL, AMPLITUDE_API_KEY, and optionally
#   MEDIA_WORKFLOW_FILE
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
#   TELEGRAM_ALLOWED_USER_IDS, WORKER_DISPATCH_TOKEN, CALLBACK_HMAC_SECRET
#
# WORKER_DISPATCH_TOKEN becomes the Worker's GITHUB_DISPATCH_TOKEN. The names
# differ because GitHub reserves the GITHUB_ prefix for secret names and refuses
# to store one, while Cloudflare has no such rule -- so the Worker keeps the
# name that says what the token is for.
#
# The Worker's custom domain belongs to Terraform, but Terraform can only route
# a hostname to a script that already exists. Run this workflow once, then set
# the WORKER_ENABLED variable to true and let terraform-apply attach the domain.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "scripts/generate-wrangler.ts"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# Two overlapping deploys would race to replace the same script, and the loser
# could land after the winner. Never cancel one in flight: an interrupted
# secret sync leaves the Worker running with a partial set.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # A variable rather than a secret, matching the Terraform workflows: the
      # account id identifies the deployment, it does not authenticate it.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Consumed by scripts/generate-wrangler.ts, which fails loudly rather
      # than deploying a Worker wired to the wrong bucket.
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      PRIVATE_BUCKET: ${{ vars.PROJECT_SLUG }}-private
      CONTENT_BUCKET: ${{ vars.PROJECT_SLUG }}-content
      CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      MEDIA_WORKFLOW_FILE: ${{ vars.MEDIA_WORKFLOW_FILE || 'process-media.yml' }}
      # Public browser ingestion key, used to scope the fallback relay to this
      # project. It is the same variable embedded in the Pages bundle.
      AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY || '' }}
      # Already qualified as owner/repo, so the Worker never has to be told
      # which repository it belongs to.
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The prompt's author context is built from the profile, which lives in
      # the public content bucket rather than in the repository.
      - name: Fetch the published profile
        run: npm run profile:fetch

      # A deploy is the wrong moment to discover the Worker does not compile.
      # Both run before anything reaches Cloudflare.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

      - name: Deploy
        run: npm run deploy

      # After the deploy, because the script has to exist before secrets can be
      # attached to it. On a first deploy that leaves a short window where the
      # Worker rejects every request for want of a webhook secret, which is the
      # safe direction to fail.
      #
      # jq builds the payload so no secret is ever interpolated into a shell
      # word, and `secret bulk` reads it from stdin so none reaches the process
      # list or the log.
      - name: Sync Worker secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          # See the note above: GitHub will not store a GITHUB_-prefixed secret.
          GITHUB_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          CALLBACK_HMAC_SECRET: ${{ secrets.CALLBACK_HMAC_SECRET }}
        run: |
          jq -n \
            --arg botToken "$TELEGRAM_BOT_TOKEN" \
            --arg webhookSecret "$TELEGRAM_WEBHOOK_SECRET" \
            --arg allowedUserIds "$TELEGRAM_ALLOWED_USER_IDS" \
            --arg dispatchToken "$GITHUB_DISPATCH_TOKEN" \
            --arg callbackSecret "$CALLBACK_HMAC_SECRET" \
            '{
              TELEGRAM_BOT_TOKEN: $botToken,
              TELEGRAM_WEBHOOK_SECRET: $webhookSecret,
              TELEGRAM_ALLOWED_USER_IDS: $allowedUserIds,
              GITHUB_DISPATCH_TOKEN: $dispatchToken,
              CALLBACK_HMAC_SECRET: $callbackSecret
            }' \
            | npx wrangler secret bulk --config wrangler.generated.json
