name: Check workflow config

# Three checks over .github/workflows, all about mistakes that reach main
# looking green.
#
# actionlint parses every workflow and checks each expression against the
# contexts it is allowed to use. Workflows that only run on workflow_dispatch
# are otherwise never parsed until someone dispatches them.
#
# Every secrets.* and vars.* reference must be declared in
# .github/config-inventory.json, and every declaration must be referenced.
# Separately, process-media.yml's failure report must name steps that exist, and
# its verification steps must still run before anything is uploaded.
#
# GitHub resolves an unknown reference to an empty string instead of failing, so
# a renamed or mistyped name ships a workflow that runs, reports success, and
# does the wrong thing. That is how secrets.GITHUB_DISPATCH_TOKEN -- a name
# GitHub will not store at all -- reached production and turned every photo
# publication into "Publication failed" with no run to look at.
#
# Deliberately credential-free, so it runs for forks too and gates the change
# before it merges. Whether the declared values actually exist on GitHub is a
# separate question, and needs an authenticated gh:
#   npm run config:check -- --live

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/check-workflow-config.ts"
      - "scripts/check-media-workflow.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "scripts/check-workflow-config.ts"
      - "scripts/check-media-workflow.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Current majors, so the job does not carry the deprecated Node 20 action
      # runtime that GitHub warns about and silently runs on 24 anyway. The
      # other workflows are still on v4 and older; that is its own board item.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # First, because a file GitHub cannot parse makes every other check on it
      # moot. process-media.yml runs only on workflow_dispatch, so until this
      # existed nothing in CI ever parsed it: `${{ cancelled() }}` in a step's
      # `env:` -- legal-looking, and rejected only inside an `if:` -- merged
      # green and took the whole workflow down on main, with media publication
      # broken until it was found. actionlint parses every workflow and knows
      # which contexts each expression may use.
      #
      # Pinned by version. Bump it deliberately: a floating tag would let a new
      # release fail an unrelated pull request.
      - uses: docker://rhysd/actionlint:1.7.7

      - run: npm ci
      - run: npm run config:check
      # The same class of silent failure one file over: an unknown step
      # reference resolves to an empty string rather than failing the run.
      - run: npm run media:check
