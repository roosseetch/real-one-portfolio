name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "profile/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      # The profile is not in the repository — it is one person's details, and
      # this repository is meant to be reusable. It lives in the public content
      # bucket instead, so the build fetches it first. Public URLs only, so no
      # credentials are needed here.
      - name: Install root tooling
        run: npm ci
      - name: Fetch the published profile
        env:
          CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL }}
        run: npm run profile:fetch
      - name: Build site
        working-directory: site
        env:
          # PAGES_BASE_PATH: set as a repository variable when serving from a
          # custom domain (use "/"); defaults to the project-pages subpath.
          VITE_BASE: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # CONTENT_BASE_URL: public content bucket base URL; unset until the
          # Cloudflare infrastructure exists, which the site handles gracefully.
          VITE_CONTENT_BASE_URL: ${{ vars.CONTENT_BASE_URL }}
          # MEDIA_BASE_URL: public media bucket base URL. While unset the site
          # renders accessible placeholders instead of photos.
          VITE_MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          # AMPLITUDE_API_KEY: Amplitude's browser ingestion key. A repository
          # variable rather than a secret because Vite inlines it into the
          # bundle every visitor downloads — calling it a secret would only
          # disguise how public it already is. Amplitude's Secret Key is a
          # different value and must never appear here.
          #
          # Unset means no analytics: Vite inlines `undefined`, the init call is
          # eliminated as dead code, and the SDK is dropped from the bundle
          # entirely. That is quiet enough to look like working analytics, so
          # the step below says which of the two happened.
          VITE_AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
          # Direct Amplitude ingestion remains the default. This relay is tried
          # only if the browser rejects the direct request.
          VITE_AMPLITUDE_SERVER_URL: ${{ vars.AMPLITUDE_SERVER_URL }}
        run: npm run build
      - name: Report whether analytics shipped
        working-directory: site
        run: |
          if grep -rqi amplitude dist/assets; then
            echo "Amplitude is in the bundle; events will be sent."
          else
            echo "::warning::AMPLITUDE_API_KEY is not set, so the site ships without analytics and Amplitude will show no data."
          fi
      # Pages drops the custom domain on some deploys unless the artifact
      # carries a CNAME. The value comes from a repository variable so no
      # domain is ever written into a tracked file.
      - name: Write CNAME when a custom domain is configured
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: printf '%s\n' "$CUSTOM_DOMAIN" > site/dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
